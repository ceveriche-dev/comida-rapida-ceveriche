<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Salchipapas</title>

    <link rel="stylesheet" href="styles.css">

</head>


<body>


    <!-- =====================================
         TÍTULO
    ====================================== -->

    <h1>
        ¡Ven a probar las mejores salchipapas de Santa Marta!
    </h1>



    <!-- =====================================
         PRODUCTOS
    ====================================== -->

    <div class="contenedor">


        <!-- SALCHIPAPA COSTEÑA -->

        <div class="card">

            <img
                src="img/sachipapa 1.webp"
                alt="Salchipapa costeña"
            >

            <p>
                La Verdadera Salchipapa Costeña
                (4 personas)
            </p>

            <p>
                $30.000
            </p>

            <button
                onclick="agregarAlCarrito(
                    'Salchipapa Costeña (4 personas)',
                    30000
                )"
            >
                Agregar al carrito
            </button>

        </div>



        <!-- PICADA 5 PERSONAS -->

        <div class="card">

            <img
                src="img/salchipapa 2.webp"
                alt="Picada para 5 personas"
            >

            <p>
                Picada para 5 personas
            </p>

            <p>
                $40.000
            </p>

            <button
                onclick="agregarAlCarrito(
                    'Picada para 5 personas',
                    40000
                )"
            >
                Agregar al carrito
            </button>

        </div>



        <!-- SALCHIPAPA SENCILLA -->

        <div class="card">

            <img
                src="img/salchipapa 3.webp"
                alt="Salchipapa sencilla"
            >

            <p>
                Salchipapa sencilla
            </p>

            <p>
                $12.000
            </p>

            <button
                onclick="agregarAlCarrito(
                    'Salchipapa Sencilla',
                    12000
                )"
            >
                Agregar al carrito
            </button>

        </div>



        <!-- PICADA 8 PERSONAS -->

        <div class="card">

            <img
                src="img/salchipapa 4.webp"
                alt="Picada para 8 personas"
            >

            <p>
                Picada para 8 personas
            </p>

            <p>
                $70.000
            </p>

            <button
                onclick="agregarAlCarrito(
                    'Picada para 8 personas',
                    70000
                )"
            >
                Agregar al carrito
            </button>

        </div>


    </div>



    <!-- =====================================
         CARRITO
    ====================================== -->

    <h2>
        🛒 Carrito
    </h2>


    <ul id="carrito"></ul>


    <h3 id="total">
        Total: $0
    </h3>



    <!-- =====================================
         BOTÓN PAGAR
    ====================================== -->

    <button
        class="boton-pagar"
        onclick="pagar()"
    >
        💳 Pagar
    </button>



    <!-- =====================================
         MODAL DE PAGO
    ====================================== -->

    <div
        id="modalPago"
        class="modal"
    >

        <div class="modal-contenido">


            <h2>
                🧾 Datos del cliente
            </h2>



            <!-- NOMBRE -->

            <label for="nombreCliente">
                Nombre completo
            </label>

            <input
                type="text"
                id="nombreCliente"
                placeholder="Escribe tu nombre"
            >



            <!-- TELÉFONO -->

            <label for="telefonoCliente">
                Teléfono
            </label>

            <input
                type="tel"
                id="telefonoCliente"
                placeholder="Escribe tu teléfono"
            >



            <!-- CORREO -->

            <label for="correoCliente">
                Correo electrónico
            </label>

            <input
                type="email"
                id="correoCliente"
                placeholder="ejemplo@gmail.com"
            >



            <!-- DIRECCIÓN -->

            <label for="direccionCliente">
                Dirección de entrega
            </label>

            <input
                type="text"
                id="direccionCliente"
                placeholder="Ej: Calle 10 #20-30"
            >



            <!-- MÉTODO DE PAGO -->

            <h3>
                💳 Método de pago
            </h3>


            <select id="metodoPago">

                <option value="">
                    Selecciona un método
                </option>

                <option value="Nequi">
                    🟣 Nequi
                </option>

                <option value="Efectivo">
                    💵 Efectivo
                </option>

            </select>



            <!-- CONFIRMAR -->

            <button
                onclick="confirmarPago()"
            >
                ✅ Confirmar pedido
            </button>



            <!-- CANCELAR -->

            <button
                onclick="cerrarModal()"
            >
                ❌ Cancelar
            </button>


        </div>

    </div>



    <!-- JAVASCRIPT -->

    <script src="script.js"></script>


</body>

</html>
