<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salchipapas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1>¡Ven a probar las mejores salchipapas de Santa Marta!</h1>

    <div class="contenedor">

        <!-- Salchipapa costeña -->
        <div class="card">
            <img src="img/sachipapa 1.webp" alt="salchipapa costeña">

            <p>La Verdadera Salchipapa Costeña (4 personas)</p>
            <p>$30.000</p>

            <button onclick="agregarAlCarrito('Salchipapa Costeña (4 personas)', 30000)">
                Agregar al carrito
            </button>
        </div>

        <!-- Picada 5 personas -->
        <div class="card">
            <img src="img/salchipapa 2.webp" alt="picada 5 personas">

            <p>Picada para 5 personas</p>
            <p>$40.000</p>

            <button onclick="agregarAlCarrito('Picada para 5 personas', 40000)">
                Agregar al carrito
            </button>
        </div>

        <!-- Salchipapa sencilla -->
        <div class="card">
            <img src="img/salchipapa 3.webp" alt="salchipapa sencilla">

            <p>Salchipapa sencilla</p>
            <p>$12.000</p>

            <button onclick="agregarAlCarrito('Salchipapa Sencilla', 12000)">
                Agregar al carrito
            </button>
        </div>

        <!-- Picada 8 personas -->
        <div class="card">
            <img src="img/salchipapa 4.webp" alt="picada 8 personas">

            <p>Picada para 8 personas</p>
            <p>$70.000</p>

            <button onclick="agregarAlCarrito('Picada para 8 personas', 70000)">
                Agregar al carrito
            </button>
        </div>

    </div>

    <h2>🛒 Carrito</h2>

    <ul id="carrito"></ul>

    <h3 id="total">Total: $0</h3>

    <button onclick="pagar()">
        💳 Pagar
    </button>

    <script src="script.js"></script>
    

<!-- 💳 MODAL DE PAGO -->
<div id="modalPago" class="modal">

    <div class="modal-contenido">

        <h2>💳 Método de pago</h2>

        <button onclick="confirmarPago('Nequi')">
            🟣  Nequi
        </button>

        <button onclick="confirmarPago('Efectivo')">
            💵  Efectivo
        </button>

        <button onclick="cerrarModal()">
            ❌ Cancelar
        </button>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
