<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gaseosas</title>

    <link rel="stylesheet" href="styles.css">

</head>


<body>


    <!-- =====================================
         TÍTULO
    ====================================== -->

    <h1>
        🥤 Gaseosas refrescantes
    </h1>



    <!-- =====================================
         PRODUCTOS
    ====================================== -->

    <div class="contenedor">


        <!-- COCA-COLA PERSONAL -->

        <div class="card">

            <img
                src="img/gaseosa pequeña.jpeg"
                alt="Coca-Cola personal"
            >

            <p>
                Coca-Cola personal (250 ml)
            </p>

            <p>
                $2.500
            </p>

            <button
                onclick="agregarAlCarrito(
                    'Coca-Cola personal (250 ml)',
                    2500
                )"
            >
                Agregar al carrito
            </button>

        </div>



        <!-- COCA-COLA LATA -->

        <div class="card">

            <img
                src="img/lata.jpeg"
                alt="Coca-Cola lata"
            >

            <p>
                Coca-Cola lata (330 ml)
            </p>

            <p>
                $3.000
            </p>

            <button
                onclick="agregarAlCarrito(
                    'Coca-Cola lata (330 ml)',
                    3000
                )"
            >
                Agregar al carrito
            </button>

        </div>



        <!-- COCA-COLA MEDIANA -->

        <div class="card">

            <img
                src="img/mediana 2.jpeg"
                alt="Coca-Cola mediana"
            >

            <p>
                Coca-Cola mediana (500 ml)
            </p>

            <p>
                $4.000
            </p>

            <button
                onclick="agregarAlCarrito(
                    'Coca-Cola mediana (500 ml)',
                    4000
                )"
            >
                Agregar al carrito
            </button>

        </div>



        <!-- COCA-COLA GRANDE -->

        <div class="card">

            <img
                src="img/grande.jpeg"
                alt="Coca-Cola grande"
            >

            <p>
                Coca-Cola grande (1.5 L)
            </p>

            <p>
                $7.500
            </p>

            <button
                onclick="agregarAlCarrito(
                    'Coca-Cola grande (1.5 L)',
                    7500
                )"
            >
                Agregar al carrito
            </button>

        </div>


    </div>



    <!-- =====================================
         CARRITO
    ====================================== -->

    <h2>
        🛒 Carrito
    </h2>


    <ul id="carrito"></ul>


    <h3 id="total">
        Total: $0
    </h3>



    <!-- =====================================
         BOTÓN PAGAR
    ====================================== -->

    <button
        class="boton-pagar"
        onclick="pagar()"
    >
        💳 Pagar
    </button>



    <!-- =====================================
         MODAL DE PAGO
    ====================================== -->

    <div
        id="modalPago"
        class="modal"
    >

        <div class="modal-contenido">


            <h2>
                🧾 Datos del cliente
            </h2>



            <!-- NOMBRE -->

            <label for="nombreCliente">
                Nombre completo
            </label>

            <input
                type="text"
                id="nombreCliente"
                placeholder="Escribe tu nombre"
            >



            <!-- TELÉFONO -->

            <label for="telefonoCliente">
                Teléfono
            </label>

            <input
                type="tel"
                id="telefonoCliente"
                placeholder="Escribe tu teléfono"
            >



            <!-- CORREO -->

            <label for="correoCliente">
                Correo electrónico
            </label>

            <input
                type="email"
                id="correoCliente"
                placeholder="ejemplo@gmail.com"
            >



            <!-- DIRECCIÓN -->

            <label for="direccionCliente">
                Dirección de entrega
            </label>

            <input
                type="text"
                id="direccionCliente"
                placeholder="Ej: Calle 10 #20-30"
            >



            <!-- MÉTODO DE PAGO -->

            <h3>
                💳 Método de pago
            </h3>


            <select id="metodoPago">

                <option value="">
                    Selecciona un método
                </option>

                <option value="Nequi">
                    🟣 Nequi
                </option>

                <option value="Efectivo">
                    💵 Efectivo
                </option>

            </select>



            <!-- CONFIRMAR PEDIDO -->

            <button
                onclick="confirmarPago()"
            >
                ✅ Confirmar pedido
            </button>



            <!-- CANCELAR -->

            <button
                onclick="cerrarModal()"
            >
                ❌ Cancelar
            </button>


        </div>

    </div>



    <!-- JAVASCRIPT -->

    <script src="script.js"></script>


</body>

</html>
