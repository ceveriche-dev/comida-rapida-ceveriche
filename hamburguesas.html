<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Almuerquesas</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <h1>ESCOGE TU HAMBURGUESA</h1>

    <!-- CARTAS -->
    <div class="contenedor">

        <!-- Hamburguesa de carne -->
        <div class="card">

            <img src="img/red.webp" alt="Hamburguesa de carne">

            <p>HAMBURGUESA DE CARNE</p>

            <p>🛒 $11.000</p>

            <button onclick="agregarAlCarrito('Hamburguesa de Carne', 11000)">
                Agregar al carrito
            </button>

        </div>


        <!-- Doble carne -->
        <div class="card">

            <img src="img/x2 carne.webp" alt="Hamburguesa doble carne">

            <p>HAMBURGUESA DE DOBLE CARNE</p>

            <p>🛒 $15.000</p>

            <button onclick="agregarAlCarrito('Hamburguesa Doble Carne', 15000)">
                Agregar al carrito
            </button>

        </div>


        <!-- Cerdo -->
        <div class="card">

            <img src="img/carne de cerdo.webp" alt="Hamburguesa de cerdo">

            <p>HAMBURGUESA DE CERDO</p>

            <p>🛒 $12.000</p>

            <button onclick="agregarAlCarrito('Hamburguesa de Cerdo', 12000)">
                Agregar al carrito
            </button>

        </div>


        <!-- Pollo -->
        <div class="card">

            <img src="img/pollo.webp" alt="Hamburguesa de pollo">

            <p>HAMBURGUESA DE POLLO</p>

            <p>🛒 $12.000</p>

            <button onclick="agregarAlCarrito('Hamburguesa de Pollo', 12000)">
                Agregar al carrito
            </button>

        </div>

    </div>


    <!-- CARRITO -->

    <h2>🛒 Carrito</h2>

    <ul id="carrito"></ul>

    <h3 id="total">Total: $0</h3>


    <!-- BOTÓN PAGAR -->

    <button class="boton-pagar" onclick="pagar()">
        💳 Pagar
    </button>


    <!-- MODAL DATOS DEL CLIENTE -->

    <div id="modalPago" class="modal">

        <div class="modal-contenido">

            <h2>🧾 Datos del cliente</h2>

            <label for="nombreCliente">
                Nombre completo
            </label>

            <input
                type="text"
                id="nombreCliente"
                placeholder="Escribe tu nombre"
            >


            <label for="telefonoCliente">
                Teléfono
            </label>

            <input
                type="tel"
                id="telefonoCliente"
                placeholder="Escribe tu teléfono"
            >


            <label for="correoCliente">
                Correo electrónico
            </label>

            <input
                type="email"
                id="correoCliente"
                placeholder="ejemplo@gmail.com"
            >


            <label for="direccionCliente">
                Dirección de entrega
            </label>

            <input
                type="text"
                id="direccionCliente"
                placeholder="Ej: Calle 10 #20-30"
            >


            <h3>💳 Método de pago</h3>

            <select id="metodoPago">

                <option value="">
                    Selecciona un método
                </option>

                <option value="Nequi">
                    🟣 Nequi
                </option>

                <option value="Efectivo">
                    💵 Efectivo
                </option>

            </select>


            <!-- BOTÓN CONFIRMAR -->

            <button onclick="confirmarPago()">
                ✅ Confirmar pedido
            </button>


            <!-- BOTÓN CANCELAR -->

            <button onclick="cerrarModal()">
                ❌ Cancelar
            </button>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
