<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="styles.css">
</head>
<body>
    

    <h1> ESCOGE TU AMBURGUESA</h1>
     

    <!--primera carta-->
    <div class="contenedor">
    
    <div class="card">

        <img src="img/red.webp" alt="" title="carne de red">
        <p> HAMBURGUESA DE CARNE </p>

        <p>🛒$ 11.000</p>

        <button onclick="agregarAlCarrito('Hamburguesa de Carne', 11000)">agregar al carrito</button>

        

    </div>
    
    <!--segunta carta-->
    <div class="card">
        <img src="img/x2 carne.webp" alt="" title="almuerquesa de carne">

        <p>AMBURGUESA DE DOBLE CARNE</p>

        <p>🛒$ 15.000</p>

        <button onclick="agregarAlCarrito('Hamburguesa Doble Carne', 15000)">agregar al carrito</button>

    
    <!--tercera carta-->
    
</div>

<div class="card">
    <img src=" img/carne de cerdo.webp" alt="" title="almuerquesa de cerdo">
    <p>AMBURGUESA DE CERDO</p>

    <p>🛒$ 12.000</p>
    <button onclick="agregarAlCarrito('Hamburguesa de Cerdo', 12000)">agregar al carrito</button>

</div>

<!--cuarta carta-->
<div class="card">
    <img src="img/pollo.webp" alt="" title="almuerquesa de pollo">
    <p>AMBURGUESA DE POLLO</p>

    <p>🛒$ 12.000</p>

    <button onclick="agregarAlCarrito('Hamburguesa de Pollo', 12000)">agregar al carrito</button>
</div>


    </div>

    <h2>🛒 carrito </h2>

        <ul id="carrito"></ul>

        <h3 id="total">Total: $0</h3>

<button class="boton-pagar" onclick="pagar()">
    💳 Pagar
</button>

    <script src="script.js"></script>

    

<!-- 💳 MODAL DE PAGO -->
<div id="modalPago" class="modal">

    <div class="modal-contenido">

        <h2>💳 Método de pago</h2>

        <button onclick="confirmarPago('Nequi')">
            🟣  Nequi
        </button>

        <button onclick="confirmarPago('Efectivo')">
            💵  Efectivo
        </button>

        <button onclick="cerrarModal()">
            ❌ Cancelar
        </button>

    </div>

</div>

<script src="script.js"></script>
    
</body>
</html>
